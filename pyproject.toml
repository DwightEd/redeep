[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "redeep-repro"
version = "0.1.0"
description = "Cross-backbone reproduction of ReDeEP with literal token-level AUROC on RAGTruth."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "DwightEd" }]
dependencies = [
  "accelerate==1.13.0",
  "huggingface-hub==0.33.4",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pyarrow==24.0.0",
  "PyYAML==6.0.3",
  "safetensors==0.7.0",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "tokenizers==0.21.4",
  "torch==2.5.1",
  "tqdm==4.67.3",
  "transformers==4.52.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.12.0",
]

[project.scripts]
redeep = "redeep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
